<style>
/* ---- Mockup chrome. Everything below is only the stage the screens sit on, the cursor and the tour. ----
   This file is the bare app: it fills whatever window it is in. marque-devices.html puts it inside a laptop,
   a tablet and a phone at each device's real screen size, so the app's own responsive layout picks the right
   design for each. */
html,body{margin:0;overflow:hidden;background-color:rgb(255, 255, 255)}
/* Phone and tablet: the device's status bar and home bar sit over the screen, so the app is kept clear of them. */
html[data-device="phone"]{--mock-top:50px;--mock-bottom:22px}
html[data-device="tablet"]{--mock-top:26px;--mock-bottom:20px}
.mock-screen{position:relative;overflow:hidden;height:100svh;transform:translateZ(0);isolation:isolate}
/* The screen is a containing block for position:fixed (transform), so the app's pinned bars stay inside it. */
#stage{position:absolute;left:0;right:0;top:var(--mock-top,0px);bottom:var(--mock-bottom,0px);overflow:hidden}
#stage .h-dvh,#stage .min-h-dvh{height:100%;min-height:0}
html[data-bare] #stage{top:0;bottom:0}

.mock-cursor{position:absolute;left:0;top:0;z-index:60;pointer-events:none;opacity:0;transition:transform .75s cubic-bezier(.65,0,.35,1),opacity .3s}
.mock-cursor svg{display:block;width:26px;height:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.mock-cursor .ring{position:absolute;left:-4px;top:-4px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);opacity:0}
.mock-cursor.click .ring{animation:mock-ring .45s ease-out}
@keyframes mock-ring{0%{transform:scale(0);opacity:.9}100%{transform:scale(1.25);opacity:0}}
/* Touch devices get a fingertip instead of an arrow. */
.mock-cursor .finger{display:none}
html[data-device="phone"] .mock-cursor svg,html[data-device="tablet"] .mock-cursor svg{display:none}
html[data-device="phone"] .mock-cursor .finger,html[data-device="tablet"] .mock-cursor .finger{display:block;position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.4);box-shadow:0 0 0 1.5px rgba(255,255,255,.75),0 4px 14px rgba(0,0,0,.4)}
html[data-device="phone"] .mock-cursor .ring,html[data-device="tablet"] .mock-cursor .ring{left:-19px;top:-19px;width:38px;height:38px}
@media(prefers-reduced-motion:reduce){.mock-cursor{display:none}}
</style>
</head>
