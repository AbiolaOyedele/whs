t-xs text-primary-foreground\">WO\u003c/span>\u003cdiv class=\"min-w-0 flex-1\">\u003cp class=\"truncate text-sm\">Work\u003c/p>\u003cp class=\"truncate text-xs text-muted-foreground\">work@gmail.com\u003c/p>\u003c/div>\u003cbutton type=\"button\" class=\"inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-normal ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 hover:bg-accent hover:text-accent-foreground h-11 w-11\" aria-label=\"Remove Work\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-trash2 h-4 w-4\">\u003cpath d=\"M3 6h18\">\u003c/path>\u003cpath d=\"M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6\">\u003c/path>\u003cpath d=\"M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2\">\u003c/path>\u003cline x1=\"10\" x2=\"10\" y1=\"11\" y2=\"17\">\u003c/line>\u003cline x1=\"14\" x2=\"14\" y1=\"11\" y2=\"17\">\u003c/line>\u003c/svg>\u003c/button>\u003c/li>\u003cli class=\"flex items-center gap-3 rounded-lg border border-border p-3\">\u003cspan class=\"flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-primary text-xs text-primary-foreground\">PE\u003c/span>\u003cdiv class=\"min-w-0 flex-1\">\u003cp class=\"truncate text-sm\">Personal\u003c/p>\u003cp class=\"truncate text-xs text-muted-foreground\">personal@gmail.com\u003c/p>\u003c/div>\u003cbutton type=\"button\" class=\"inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-normal ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 hover:bg-accent hover:text-accent-foreground h-11 w-11\" aria-label=\"Remove Personal\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-trash2 h-4 w-4\">\u003cpath d=\"M3 6h18\">\u003c/path>\u003cpath d=\"M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6\">\u003c/path>\u003cpath d=\"M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2\">\u003c/path>\u003cline x1=\"10\" x2=\"10\" y1=\"11\" y2=\"17\">\u003c/line>\u003cline x1=\"14\" x2=\"14\" y1=\"11\" y2=\"17\">\u003c/line>\u003c/svg>\u003c/button>\u003c/li>\u003c/ul>\u003cform class=\"flex flex-col gap-3 sm:flex-row\">\u003cinput type=\"text\" class=\"flex h-11 w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground ring-offset-background transition-colors placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50\" placeholder=\"Account name (e.g. Work)\" maxlength=\"40\" aria-label=\"Account name\" value=\"\">\u003cbutton type=\"submit\" class=\"inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-normal ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 bg-primary text-primary-foreground hover:bg-primary/90 h-11 px-6 py-2\" disabled=\"\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-plus h-4 w-4\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"M12 5v14\">\u003c/path>\u003c/svg> Add account\u003c/button>\u003c/form>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"opacity: 1; transform: none;\">\u003cdiv class=\"glass rounded-lg text-card-foreground\">\u003cdiv class=\"flex flex-col space-y-1.5 p-6\">\u003ch3 class=\"text-lg font-normal leading-none tracking-tight\">Automation\u003c/h3>\u003cp class=\"text-sm text-muted-foreground\">When Lazy Meet joins, when to remind you, and days to sit out.\u003c/p>\u003c/div>\u003cdiv class=\"p-6 pt-0 space-y-4\">\u003cdiv class=\"flex flex-wrap items-center justify-between gap-4\">\u003cdiv class=\"min-w-0\">\u003clabel for=\"join-lead\" class=\"text-sm\">Join before start\u003c/label>\u003cp class=\"text-sm text-muted-foreground\">0 joins exactly on time. Up to 60 minutes early.\u003c/p>\u003c/div>\u003cdiv class=\"flex items-center gap-2\">\u003cinput type=\"number\" class=\"flex h-11 rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground ring-offset-background transition-colors placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 w-24\" id=\"join-lead\" inputmode=\"numeric\" min=\"0\" max=\"60\" value=\"0\">\u003cspan class=\"text-sm text-muted-foreground\">min\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"flex flex-wrap items-center justify-between gap-4 border-t border-border pt-4\">\u003cdiv class=\"min-w-0\">\u003clabel for=\"reminder\" class=\"text-sm\">Remind me before a meeting\u003c/label>\u003cp class=\"text-sm text-muted-foreground\">Leave empty for no reminder. 1–60 minutes before start.\u003c/p>\u003c/div>\u003cdiv class=\"flex items-center gap-2\">\u003cinput type=\"number\" class=\"flex h-11 rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground ring-offset-background transition-colors placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 w-24\" id=\"reminder\" inputmode=\"numeric\" min=\"1\" max=\"60\" placeholder=\"Off\" value=\"\">\u003cspan class=\"text-sm text-muted-foreground\">min before\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"border-t border-border pt-4\">\u003cdiv>\u003cdiv class=\"flex flex-wrap items-center justify-between gap-3\">\u003cdiv>\u003cp class=\"text-sm\">Out of office\u003c/p>\u003cp class=\"text-sm text-muted-foreground\">No days set. Meetings join as normal.\u003c/p>\u003c/div>\u003cbutton type=\"button\" class=\"inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-normal ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-11 rounded-md px-4\" aria-expanded=\"false\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-calendar-days h-4 w-4\">\u003cpath d=\"M8 2v4\">\u003c/path>\u003cpath d=\"M16 2v4\">\u003c/path>\u003crect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\">\u003c/rect>\u003cpath d=\"M3 10h18\">\u003c/path>\u003cpath d=\"M8 14h.01\">\u003c/path>\u003cpath d=\"M12 14h.01\">\u003c/path>\u003cpath d=\"M16 14h.01\">\u003c/path>\u003cpath d=\"M8 18h.01\">\u003c/path>\u003cpath d=\"M12 18h.01\">\u003c/path>\u003cpath d=\"M16 18h.01\">\u003c/path>\u003c/svg>Edit days\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"opacity: 1; transform: none;\">\u003cdiv class=\"glass rounded-lg text-card-foreground\">\u003cdiv class=\"flex flex-col space-y-1.5 p-6\">\u003cdiv class=\"flex items-center justify-between gap-4\">\u003cdiv class=\"min-w-0\">\u003ch3 class=\"text-lg font-normal leading-none tracking-tight\">Daily check\u003c/h3>\u003cp class=\"text-sm text-muted-foreground\">Sweep every calendar once a day and tell you what's coming.\u003c/p>\u003c/div>\u003cbutton type=\"button\" role=\"switch\" aria-checked=\"false\" class=\"relative inline-flex h-6 w-11 shrink-0 items-center rounded-full border transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:cursor-not-allowed disabled:opacity-50 border-input bg-muted\" aria-label=\"Daily check\">\u003cspan class=\"inline-block h-4 w-4 rounded-full transition-transform translate-x-1 bg-muted-foreground\">\u003c/span>\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"opacity: 1; transform: none;\">\u003cdiv class=\"glass rounded-lg text-card-foreground\">\u003cdiv class=\"flex flex-col space-y-1.5 p-6\">\u003ch3 class=\"text-lg font-normal leading-none tracking-tight\">General\u003c/h3>\u003cp class=\"text-sm text-muted-foreground\">Appearance and startup behaviour.\u003c/p>\u003c/div>\u003cdiv class=\"p-6 pt-0 space-y-4\">\u003cdiv class=\"flex flex-wrap items-center justify-between gap-4\">\u003cdiv class=\"min-w-0\">\u003clabel for=\"theme\" class=\"text-sm\">Appearance\u003c/label>\u003c/div>\u003cselect id=\"theme\" class=\"h-11 w-36 rounded-md border border-input bg-transparent px-3 text-sm\">\u003coption value=\"light\">Light\u003c/option>\u003coption value=\"dark\">Dark\u003c/option>\u003coption value=\"system\">System\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"flex flex-wrap items-center justify-between gap-4 border-t border-border pt-4\">\u003cdiv class=\"min-w-0\">\u003clabel class=\"text-sm\">Launch at login\u003c/label>\u003cp class=\"text-sm text-muted-foreground\">Start Lazy Meet automatically so it can join meetings unattended.\u003c/p>\u003c/div>\u003cbutton type=\"button\" role=\"switch\" aria-checked=\"false\" class=\"relative inline-flex h-6 w-11 shrink-0 items-center rounded-full border transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:cursor-not-allowed disabled:opacity-50 border-input bg-muted\" aria-label=\"Launch at login\">\u003cspan class=\"inline-block h-4 w-4 rounded-full transition-transform translate-x-1 bg-muted-foreground\">\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"flex flex-wrap items-center justify-between gap-4 border-t border-border pt-4\">\u003cdiv class=\"min-w-0\">\u003clabel class=\"text-sm\">Show the meeting when it joins\u003c/label>\u003cp class=\"text-sm text-muted-foreground\">Brings the call to the front the moment it joins. Turn off to keep it in the background.\u003c/p>\u003c/div>\u003cbutton type=\"button\" role=\"switch\" aria-checked=\"true\" class=\"relative inline-flex h-6 w-11 shrink-0 items-center rounded-full border transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:cursor-not-allowed disabled:opacity-50 border-brand bg-brand dark:border-foreground dark:bg-foreground\" aria-label=\"Show the meeting when it joins\">\u003cspan class=\"inline-block h-4 w-4 rounded-full transition-transform translate-x-6 bg-background\">\u003c/span>\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"opacity: 1; transform: none;\">\u003cdiv class=\"glass rounded-lg text-card-foreground\">\u003cdiv class=\"flex flex-col space-y-1.5 p-6\">\u003ch3 class=\"text-lg font-normal leading-none tracking-tight\">Feedback\u003c/h3>\u003cp class=\"text-sm text-muted-foreground\">Ideas, bugs, or requests all come straight to us.\u003c/p>\u003c/div>\u003cdiv class=\"p-6 pt-0 spac     if(head&&first) head.animate([{opacity:0,transform:'translateY(-8px)'},{opacity:1,transform:'none'}],{duration:420,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'});
  }
  /* The document pane scrolls to the chosen section: from where it was to where the app had it. */
  function scrollers(root){ return [].slice.call(root.querySelectorAll('[data-mock-scroll],[data-mock-scroll-x]')); }
  function restore(root,name){
    var els=scrollers(root); if(!els.length){ tops.last=[]; return; }
    var prev=tops.last||[], now=[];
    els.forEach(function(el,i){
      var toY=parseFloat(el.getAttribute('data-mock-scroll'))||0, toX=parseFloat(el.getAttribute('data-mock-scroll-x'))||0;
      var from=prev[i]||{y:0,x:0}; now.push({y:toY,x:toX});
      if(reduce||(from.y===toY&&from.x===toX)){ el.style.scrollBehavior='auto'; el.scrollTop=toY; el.scrollLeft=toX; return; }
      el.style.scrollBehavior='auto'; el.scrollTop=from.y; el.scrollLeft=from.x; var t0=null;
      requestAnimationFrame(function f(t){ if(t0===null) t0=t; var k=Math.min(1,(t-t0)/900), e=ease(k); el.scrollTop=from.y+(toY-from.y)*e; el.scrollLeft=from.x+(toX-from.x)*e; if(k<1) requestAnimationFrame(f); });
    });
    tops.last=now;
  }

  function current(){ return stage.getAttribute('data-view'); }
  function show(name,first){
    var v=byName[name]; if(!v||(current()===name&&!first)) return;
    stage.innerHTML=markup(v); stage.setAttribute('data-view',name);
    var root=stage.querySelector("body > div")||stage.firstElementChild;
    if(root){ var clear=function(c){ return !c||/rgba\(0, 0, 0, 0\)|transparent/.test(c); }, bg=getComputedStyle(root).backgroundColor; screen.style.backgroundColor=clear(bg)?'transparent':bg; }
    stage.querySelectorAll('textarea,input,select,button,a').forEach(function(el){ el.setAttribute('tabindex','-1'); });
    if(name===TOUR[0].name) tops.last=[];
    restore(stage,name); enter(stage,first||name===TOUR[0].name);
  }
  function place(){
    var el=stage.querySelector('[data-mock-click]'); if(!el) return null;
    var box=screen.getBoundingClientRect(), r=el.getBoundingClientRect();
    return {x:r.left-box.left+r.width*.5,y:r.top-box.top+r.height*.5,el:el};
  }

  /* Visitors can click the real links and buttons that matter; everything else is a picture. */
  stage.addEventListener('click',function(e){ e.preventDefault(); });
  screen.addEventListener('pointerdown',function(){ stop(); });

  function run(){
    if(!running) return;
    var s=TOUR[step], p=place();
    settle=setTimeout(function(){
      if(!running) return;
      var q=place();
      if(q){ cur.style.opacity=1; cur.style.transform='translate('+q.x+'px,'+q.y+'px)'; }
      settle=setTimeout(function(){
        if(!running) return;
        if(q){ cur.classList.remove('click'); void cur.offsetWidth; cur.classList.add('click'); if(q.el.animate) q.el.animate([{transform:'scale(1)'},{transform:'scale(.96)'},{transform:'scale(1)'}],{duration:220,easing:'ease-out'}); }
        var nextStep=(step+1)%TOUR.length; step=nextStep; show(TOUR[nextStep].name);
        run();
      }, TRAVEL);
    }, Math.max(0,s.hold-TRAVEL));
  }
  function start(){
    if(running||chosen||reduce) return;
    step=0; tops={}; show(TOUR[0].name,true);
    running=true; window.__mockStarted=Date.now(); window.__mockLoopMs=TOUR.reduce(function(a,s){return a+s.hold;},0); run();
  }
  function pause(){ running=false; clearTimeout(timer); clearTimeout(settle); }
  function stop(){ chosen=true; pause(); cur.style.opacity=0; }

  show(TOUR[0].name,true);
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){ if(es[0].isIntersecting) start(); else pause(); },{threshold:.35}).observe(screen);
  } else start();
  addEventListener('resize',function(){ if(running){ pause(); start(); } });
})();
</script>
</body>
