<!doctype html>
<html lang="en">
<head>
<script>/* pace: ?pace=1.8 stretches every timed step of the tour (added by WildHands for the v2 site; re-add after regenerating in Joisti) */(function(){var p=parseFloat(new URLSearchParams(location.search).get('pace'));if(!(p>0)||p===1)return;var st=window.setTimeout;window.setTimeout=function(f,ms){var a=[].slice.call(arguments,2);return st.apply(window,[f,(+ms||0)*p].concat(a));};})();</script><script>(function(){var q=new URLSearchParams(location.search),d=q.get('device'),r=document.documentElement;if(d==='tablet'||d==='phone')r.setAttribute('data-device',d);if(q.get('bare')==='1')r.setAttribute('data-bare','1')})()</script>
<style>html[data-bare]{--safe-top:0px!important;--safe-bottom:0px!important}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WildHands admin preview</title>
<!--
  A shop's admin panel in WildHands colours and type, on sample data, for the
  "What we build" pages (/what-we-build/...). Its structure follows the admin
  panels WildHands has built (the Tomori back office and the storefront admin):
  sections named in plain words, a live preview beside every edit, Save kept
  separate from Publish, visitors counted on the site itself with no ad
  trackers. Every shop, product, customer and number here is example data.

  Written by hand, not generated in Joisti. No build step, no dependencies:
  the only outside files are the site's own fonts in /fonts.

  ONE FILE, FOUR COPIES: wh-cms.html, wh-dashboard.html, wh-analytics.html and
  wh-search.html are identical. The file name picks the tour. Edit one, then
  copy it over the other three.

  ?device=tablet|phone  leaves room for the device's status and home bars
  ?bare=1               drops that room (how the site shows it)
  ?pace=1.8             stretches every timed step of the tour
  The tour pauses while the page is off screen or hidden, stops for good on
  the first tap or key press, and does not run under prefers-reduced-motion.
-->
<style>
@font-face{font-family:'IBM Plex Sans';src:url('/fonts/IBMPlexSans-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('/fonts/IBMPlexSans-500.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('/fonts/IBMPlexSans-600.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Diagramm';src:url('/fonts/Diagramm-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
:root{--ink:#131314;--ink-2:#232326;--lime:#befc65;--lime-2:#dcfda8;--lime-3:#ecfecc;--lime-deep:#4d7c0f;--s50:#f4f4f5;--s100:#e4e4e7;--s200:#d8d8dc;--s300:#cfcfd4;--s400:#a1a1aa;--muted:#6b6a73;--safe-top:0px;--safe-bottom:0px;--r:16px;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;--display:'Diagramm','IBM Plex Sans',sans-serif}
html[data-device="phone"]{--safe-top:47px;--safe-bottom:22px}
html[data-device="tablet"]{--safe-top:24px;--safe-bottom:20px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--s50)}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
b,strong{font-weight:500}
small{font-size:12px;color:var(--muted)}

/* ---- Mockup chrome: the frame, the screens, the pointer. ---- */
.mock-screen{position:relative;overflow:hidden;height:100svh;isolation:isolate;transform:translateZ(0)}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.side{display:none}
.top{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(var(--safe-top) + 10px) 16px 10px;background:var(--ink);color:#fff}
.top .where{margin-left:auto;font:400 11px var(--mono);text-transform:uppercase;color:var(--s400)}
.badge{width:32px;height:32px;border-radius:9px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:500;font-size:16px;flex-shrink:0}
.main{position:relative;flex:1;min-height:0}
.mock-view{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;visibility:hidden;padding:18px 16px calc(92px + var(--safe-bottom))}
.mock-view::-webkit-scrollbar{display:none}
.mock-view.on{visibility:visible}
.dock{position:absolute;z-index:20;left:50%;bottom:calc(var(--safe-bottom) + 12px);transform:translateX(-50%);display:flex;gap:2px;padding:5px;background:var(--ink);border-radius:999px;box-shadow:0 10px 30px rgba(19,19,20,.28)}
.dock a{width:52px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--s400)}
.dock a.on{background:var(--lime);color:var(--ink)}
@media(min-width:1000px){
  .app{flex-direction:row}
  .top,.dock{display:none}
  .side{display:flex;flex-direction:column;width:240px;flex-shrink:0;background:var(--ink);color:#fff;padding:22px 14px 18px;overflow:hidden}
  .mock-view{padding:30px 40px 48px}
}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.side .brand small{display:block;color:var(--s400)}
.side h6{font:400 11px var(--mono);text-transform:uppercase;color:var(--s400);padding:14px 10px 6px}
.side a{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:10px;color:var(--s100)}
.side a.on{background:var(--lime);color:var(--ink);font-weight:500}
.side .note{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:var(--s400);line-height:1.45}

/* ---- Shared pieces ---- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:18px}
.ph h1{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.05;letter-spacing:-.025em}
.ph p{color:var(--muted);margin-top:6px;max-width:46ch}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);margin-bottom:8px;font-size:13px}
@media(min-width:1000px){.ph h1{font-size:36px}}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;font-weight:500;white-space:nowrap;transition:background-color .2s,box-shadow .2s}
.btn-lime{background:var(--lime);color:var(--ink)}
.btn-ghost{background:#fff;box-shadow:inset 0 0 0 1px var(--s200)}
.status{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.status:empty{display:none}
.status.ok{color:var(--lime-deep)}
.status svg.i{width:15px;height:15px}
.card{background:#fff;border-radius:var(--r);box-shadow:0 0 0 1px var(--s100);padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.k{font:400 11px var(--mono);text-transform:uppercase;color:var(--muted)}
.disp{font-family:var(--display);font-weight:500;letter-spacing:-.025em}
.stack>*+*{margin-top:14px}
.two{display:grid;gap:14px;margin-top:14px}
@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.stats.s3{grid-template-columns:repeat(3,1fr)}}
.stat .v{font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-.02em;margin-top:10px}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;padding:4px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 1px var(--s200)}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:34px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap;transition:background-color .2s,color .2s}
.seg button.on{background:var(--ink);color:#fff}
.chip{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:999px;font-size:12px;background:var(--s50);color:var(--muted);box-shadow:inset 0 0 0 1px var(--s200);white-space:nowrap}
.chip.lime{background:var(--lime-2);color:#2f4a0a;box-shadow:none}
.chip.ink{background:var(--ink);color:#fff;box-shadow:none}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--s100)}
.row:first-child{border-top:0;padding-top:2px}
.row .grow{flex:1;min-width:0}
.row .grow small{display:block;margin-top:2px}
.row .end{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ico{width:36px;height:36px;border-radius:10px;background:var(--s50);display:grid;place-items:center;flex-shrink:0}
.new{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:var(--lime-3)}100%{background:transparent}}
.sw{border-radius:10px;flex-shrink:0}
.sw1{background:radial-gradient(circle at 50% 50%,#c9d3f0 0 18%,transparent 20%) 0 0/14px 14px,#26335f}
.sw2{background:repeating-linear-gradient(45deg,#b5522d 0 6px,#e9b48a 6px 9px)}
.sw3{background:radial-gradient(circle,#f2c14e 0 24%,transparent 26%) 0 0/12px 12px,#0f6b5c}
.sw4{background:repeating-linear-gradient(90deg,#5d4a8c 0 5px,#c8b9e8 5px 10px)}
.sw5{background:linear-gradient(135deg,#1f2a44 0 50%,#d9a441 50% 100%) 0 0/16px 16px}
.sw6{background:repeating-radial-gradient(circle at 50% 50%,#befc65 0 3px,#131314 3px 7px)}
.toast{position:absolute;z-index:150;left:16px;right:16px;top:calc(var(--safe-top) + 62px);display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--ink);color:#fff;box-shadow:0 14px 34px rgba(19,19,20,.3);opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast svg.i{color:var(--lime)}
@media(min-width:1000px){.toast{left:auto;right:28px;top:auto;bottom:28px;max-width:400px}}

/* ---- Fields (the editor's inputs are drawn, so the tour can type into them) ---- */
.field+.field{margin-top:16px}
.field label{display:block;font-weight:500;margin-bottom:6px}
.field small{display:block;margin-top:6px}
.inp{display:block;min-height:44px;padding:11px 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--s200);transition:box-shadow .2s;word-break:break-word}
.inp.ta{min-height:72px}
.inp .caret{display:none;width:1.5px;height:1.1em;background:var(--ink);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
.field.focus .inp{box-shadow:inset 0 0 0 2px var(--ink),0 0 0 4px var(--lime-2)}
.field.focus .caret{display:inline-block}
@keyframes blink{50%{opacity:0}}
.sel{display:flex;align-items:center;justify-content:space-between}
.sel svg.i{transform:rotate(90deg);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---- Home ---- */
.home-grid{display:grid;gap:14px;margin-bottom:14px}
@media(min-width:1000px){.home-grid{grid-template-columns:7fr 5fr}}
.hero{background:var(--ink);color:#fff;box-shadow:none}
.hero .k{color:var(--s400)}
.hero-v{font-size:40px;margin-top:10px;line-height:1}
.hero-s{color:var(--s300);margin-top:8px}
.bars{display:flex;align-items:flex-end;gap:8px;height:118px;margin-top:20px}
@media(min-width:1000px){.hero-v{font-size:52px}.bars{height:150px}}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar i{display:block;width:100%;height:0;border-radius:6px;background:rgba(255,255,255,.16);transition:height .7s cubic-bezier(.2,.7,.2,1)}
.bar.today i{background:var(--lime)}
.bar span{font-size:11px;color:var(--s400)}
.tabrow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:-4px -4px 10px;padding:4px}
.tabrow::-webkit-scrollbar{display:none}
.tabrow button{min-height:36px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap}
.tabrow button.on{background:var(--s50);color:var(--ink);box-shadow:inset 0 0 0 1px var(--s200)}
.panel{display:none}
.panel.on{display:block}
.meter{height:6px;border-radius:6px;background:var(--s100);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:6px;background:var(--ink);transition:width .7s cubic-bezier(.2,.7,.2,1)}
.meter.lime i{background:var(--lime-deep)}

/* ---- Products ---- */
.prod{cursor:pointer}
.prod .sw{width:46px;height:46px}
.sizes{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.sizes .chip{min-height:22px;padding:0 7px;font-size:11px}
.ed-grid{display:grid;gap:14px}
@media(min-width:1000px){.ed-grid{grid-template-columns:minmax(0,400px) minmax(0,1fr)}.ed-grid.even{grid-template-columns:1fr 1fr}}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photos .sw{aspect-ratio:1;border-radius:12px}
.photos .add{aspect-ratio:1;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--s300);display:grid;place-items:center;color:var(--muted)}
.stock{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--s100)}
.stock:first-of-type{border-top:0}
.stock b{width:44px}
.step{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--s200)}
.step button{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;font-size:18px;line-height:1}
.step span{min-width:26px;text-align:center;font-weight:500}

/* ---- Website editor and its preview of the shop ---- */
.prev-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;color:var(--muted);font-size:12px}
.prev-h span{display:inline-flex;align-items:center;gap:6px}
.prev-h svg.i{width:15px;height:15px}
.site{border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--s100)}
.site-nav{display:flex;align-items:center;gap:14px;padding:12px 16px;font-size:12px;color:var(--muted)}
.site-nav b{font-family:var(--display);font-size:16px;color:var(--ink);margin-right:auto}
.site-hero{position:relative;min-height:220px;display:flex;align-items:flex-end;padding:20px;color:#fff}
.site-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(19,19,20,.9),rgba(19,19,20,.55) 55%,rgba(19,19,20,.15))}
.site-copy{position:relative;max-width:420px}
.site-copy h2{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.05;letter-spacing:-.025em}
.site-copy p{margin-top:8px;color:var(--s100);font-size:13px}
.site-btn{display:inline-flex;align-items:center;min-height:36px;margin-top:12px;padding:0 14px;border-radius:999px;background:var(--lime);color:var(--ink);font-weight:500;font-size:13px}
.site-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px 16px}
.site-grid .sw{aspect-ratio:4/5;border-radius:8px}
.site-grid b{display:block;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-grid small{font-size:11px}
@media(min-width:1000px){.site-hero{min-height:290px}.site-copy h2{font-size:34px}}

/* ---- Visitors ---- */
.cols{position:relative;display:flex;align-items:flex-end;gap:3px;height:150px}
.col{flex:1;height:100%;display:flex;align-items:flex-end}
.col i{display:block;width:100%;height:0;border-radius:4px 4px 2px 2px;background:var(--ink);transition:height .7s cubic-bezier(.2,.7,.2,1),background-color .2s}
.col.hl i{background:var(--lime);box-shadow:inset 0 0 0 1.5px var(--ink)}
.axis{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)}
.tip{position:absolute;z-index:3;bottom:100%;transform:translate(-50%,-6px);padding:8px 10px;border-radius:10px;background:var(--ink);color:#fff;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.tip.on{opacity:1}
.bl+.bl{margin-top:12px}
.bl div{display:flex;justify-content:space-between;gap:10px}
.dn{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;-webkit-mask:radial-gradient(circle,transparent 54%,#000 55%);mask:radial-gradient(circle,transparent 54%,#000 55%)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
.heat i{display:block;height:34px;border-radius:3px}
.heat-ax{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted)}
.fn+.fn{margin-top:12px}
.fn div{display:flex;justify-content:space-between;gap:10px}

/* ---- Money ---- */
.gcols{display:flex;align-items:flex-end;gap:14px;height:170px}
.gcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.gcol .pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.gcol .pair i{display:block;width:44%;max-width:28px;height:0;border-radius:5px 5px 2px 2px;transition:height .7s cubic-bezier(.2,.7,.2,1)}
.gcol .pair i.a{background:var(--lime);box-shadow:inset 0 0 0 1.5px var(--ink)}
.gcol .pair i.b{background:var(--ink)}
.gcol span{font-size:11px;color:var(--muted)}
.report{max-width:620px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 0 16px;border-bottom:1px dashed var(--s300)}
.sum .v{font-family:var(--display);font-weight:500;font-size:22px;margin-top:6px}
.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--s100)}
.line:first-of-type{border-top:0}
.total{display:flex;justify-content:space-between;padding-top:12px;margin-top:4px;border-top:1.5px solid var(--ink);font-weight:500}

/* ---- Search ---- */
.serp{margin-top:10px;padding:14px;border-radius:12px;background:var(--s50)}
.serp .u{display:flex;align-items:center;gap:8px}
.serp .u small{display:block}
.fav{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-family:var(--display);font-size:13px;flex-shrink:0}
.serp h3{font-size:18px;font-weight:400;margin-top:8px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--s300);text-underline-offset:3px;line-height:1.3}
.serp p{color:var(--muted);margin-top:4px;font-size:13px}
.share{display:flex;gap:12px;margin-top:10px;padding:10px;border-radius:12px;background:var(--s50)}
.share .sw{width:72px;height:72px}
.share b{display:block;font-size:13px}
.share p{font-size:12px;color:var(--muted);margin-top:2px}
.code{margin-top:14px;padding:16px;border-radius:12px;background:var(--ink);color:var(--s100);font:400 12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-all;min-height:210px}
.code .t{color:var(--lime)}
.code .c{color:var(--s400)}
.code .ln{display:block;animation:ln .35s ease-out both}
@keyframes ln{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* The pointer: an arrow on a laptop, a fingertip on a phone or tablet. */
.mock-cursor{position:absolute;left:0;top:0;z-index:200;pointer-events:none;opacity:0;transition:transform .75s cubic-bezier(.65,0,.35,1),opacity .3s}
.mock-cursor svg{display:block;width:26px;height:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.mock-cursor .ring{position:absolute;left:-4px;top:-4px;width:34px;height:34px;border-radius:50%;background:rgba(120,120,125,.45);transform:scale(0);opacity:0}
.mock-cursor.click .ring{animation:mock-ring .45s ease-out}
@keyframes mock-ring{0%{transform:scale(0);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.mock-cursor .finger{display:none}
html[data-device="phone"] .mock-cursor svg,html[data-device="tablet"] .mock-cursor svg{display:none}
html[data-device="phone"] .mock-cursor .finger,html[data-device="tablet"] .mock-cursor .finger{display:block;position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;background:rgba(20,20,22,.32);box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 4px 14px rgba(0,0,0,.35)}
html[data-device="phone"] .mock-cursor .ring,html[data-device="tablet"] .mock-cursor .ring{left:-19px;top:-19px;width:38px;height:38px}
@media(prefers-reduced-motion:reduce){.mock-cursor{display:none}*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

  /* ---- The tour: the pointer goes to a control, presses it, and the app does what a press does ---- */
  var token=0, running=false, chosen=false, TRAVEL=750;
  function wait(ms){ var t=token; return new Promise(function(res,rej){ setTimeout(function(){ if(t===token) res(); else rej(new Error('paused')); },ms); }); }

    return null;
  }
  async function reveal(el){
    var v=el.closest('.mock-view'); if(!v) return;
    var r=el.getBoundingClientRect(), vr=v.getBoundingClientRect();
    if(r.top<vr.top+12||r.bottom>vr.bottom-96){ v.scrollTo({top:Math.max(0,v.scrollTop+(r.top-vr.top)-vr.height*.3),behavior:'smooth'}); await wait(700); }
  }
  async function point(el){
    var box=screen.getBoundingClientRect(), r=el.getBoundingClientRect();
    cur.style.opacity=1; cur.style.transform='translate('+(r.left-box.left+Math.min(r.width*.5,60))+'px,'+(r.top-box.top+r.height*.55)+'px)';
    await wait(TRAVEL);
  }

  async function tap(sel){

    await reveal(el); await point(el); press(el); act(el);

  async function scrollTo(sel){

  }
  /* Clears a drawn field and types into it, mirroring every letter into the preview. */
  async function type(fieldSel,text,mirror){
    var field=find(fieldSel); if(!field) return;
    var inp=$('.inp',field), txt=$('.txt',field);
    await reveal(field); await point(inp); press(inp); field.classList.add('focus');

    while(value.length){ value=value.slice(0,-2); txt.textContent=value; mirror(value); await wait(24); }
    await wait(200);
    for(var i=1;i<=text.length;i++){ value=text.slice(0,i); txt.textContent=value; mirror(value); await wait(text.charAt(i-1)===' '?70:42); }
    await wait(400); field.classList.remove('focus');
  }

  function reset(){ S=init(); renderAll(); show(START[TOUR]); }
  async function loop(){
    try{
      for(;;){
        var steps=TOURS[TOUR]||TOURS.cms;
        for(var i=0;i<steps.length;i++) await steps[i]();
        cur.style.opacity=0; await wait(600); reset();
      }
    }catch(e){ /* paused: the next start begins again from a fresh screen */ }
  }
  function start(){
    if(running||chosen||reduce) return;
    running=true; token++; reset(); window.__mockStarted=Date.now(); loop();
  }
  function pause(){ running=false; token++; cur.style.opacity=0; toastEl.classList.remove('on'); }
  function stop(){ if(chosen) return; chosen=true; pause(); }

  document.getElementById('side').innerHTML=navHtml();
  document.getElementById('dock').innerHTML=dockHtml();
  reset();
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){ if(es[0].isIntersecting) start(); else pause(); },{threshold:.35}).observe(screen);
  } else start();
  document.addEventListener('visibilitychange',function(){ if(document.hidden) pause(); else if(!chosen) start(); });
  /* Only a change of layout (sidebar or dock) restarts the tour; a plain rescale does not. */
  var wide=matchMedia('(min-width:1000px)').matches;
  addEventListener('resize',function(){ var now=matchMedia('(min-width:1000px)').matches; if(now!==wide){ wide=now; if(running){ pause(); start(); } } });
})();
