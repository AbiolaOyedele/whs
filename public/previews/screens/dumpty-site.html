  ['pointerdown','wheel','touchstart','keydown'].forEach(function(n){ screen.addEventListener(n,function(){ chosen=true; pause(); },{passive:true}); });
  if('IntersectionObserver' in window) new IntersectionObserver(function(es){ if(es[0].isIntersecting) start(); else pause(); },{threshold:.35}).observe(screen); else start();
  addEventListener('resize',function(){ if(running){ pause(); start(); } });
})();
</script>
